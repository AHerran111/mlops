<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Embedded tableau dashboards</title>
    <style>
        :root {
            --ink: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --accent: #1d4ed8;
            --bg-soft: #f8fafc;
            --err: #b91c1c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
        }

        header {
            padding: 20px 24px 0;
            border-bottom: 1px solid var(--line);
        }

        h1 { margin: 0 0 14px; font-size: 1.6rem; }

        .tabs { display: flex; gap: 4px; }

        .tab {
            border: none;
            background: none;
            padding: 10px 16px;
            font: inherit;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab[aria-selected="true"] {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        .panel { padding: 24px; }
        .panel[hidden] { display: none; }

        /* Prediction form */
        .predict-wrap { max-width: 720px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }

        select, input {
            width: 100%;
            padding: 9px 10px;
            font: inherit;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
        }

        select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

        .hint { font-size: .8rem; color: var(--muted); margin-top: 4px; min-height: 1em; }

        button.primary {
            margin-top: 20px;
            padding: 10px 22px;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button.primary:disabled { opacity: .6; cursor: progress; }

        .result {
            margin-top: 24px;
            padding: 18px 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg-soft);
        }

        .result[hidden] { display: none; }
        .result .big { font-size: 1.8rem; font-weight: 700; margin: 4px 0; }
        .result.error { border-color: #fecaca; background: #fef2f2; color: var(--err); }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: .8rem;
            background: #fff;
            border: 1px solid var(--line);
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>

            if (typeof v === 'string') {
                try { return findNumber(JSON.parse(v)); } catch { const n = parseFloat(v); return isFinite(n) ? n : null; }

            if (Array.isArray(v)) { for (const x of v) { const n = findNumber(x); if (n !== null) return n; } }

            $result.hidden = false;
        }

        // ---------------- Submit ----------------
        document.getElementById('predict-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const terrain = parseFloat($terrain.value);
            if (!(terrain > 0)) { showResult('Terrain must be a number greater than 0.', true); return; }

            const payload = {
                request: {
                    Municipality: $mun.value,
                    CP: parseInt($cp.value, 10),
                    Year: parseInt($year.value, 10),
                    Quarter: parseInt($quarter.value, 10),
                    Terrain: terrain,
                    Type: $type.value
                }
            };

            $submit.disabled = true;
            $submit.textContent = 'Predicting…';
            try {
                // POST with the JSON body and no headers on purpose: keeps it a CORS "simple request" (no OPTIONS preflight).
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const text = await res.text();
                let data; try { data = JSON.parse(text); } catch { data = text; }

                if (!res.ok) throw new Error(`HTTP ${res.status}: ${typeof data === 'string' ? data : JSON.stringify(data)}`);

                // Expected: {"prediction": [3503336.79]}
                const value = (data && Array.isArray(data.prediction) && typeof data.prediction[0] === 'number')
                    ? data.prediction[0]
                    : findNumber(data);
                if (value === null) throw new Error('Unexpected response: ' + (typeof data === 'string' ? data : JSON.stringify(data)));
                const r = payload.request;
                showResult(
                    `<div>Estimated price</div>
                     <div class="big">${value !== null ? mxn.format(value) : '—'}</div>
                     <div class="hint">${esc(r.Type)} · ${r.Terrain} m² · CP ${r.CP}, ${esc(r.Municipality)} · ${r.Year} Q${r.Quarter}</div>
                     <details><summary class="hint">Raw response</summary><pre>${esc(typeof data === 'string' ? data : JSON.stringify(data, null, 2))}</pre></details>`
                );
            } catch (err) {
                showResult(`Could not get a prediction.<br><small>${esc(err.message)}</small>`, true);
            } finally {
                $submit.disabled = false;
                $submit.textContent = 'Predict price';
            }
        });
    </script>
</body>

</html>
